<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHADMAN SHAKIB</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    background: url("https://images.unsplash.com/photo-1518770660439-4636190af475") no-repeat center center/cover;
    background-color: 
    radial-gradient(circle at top, #0f2027, #020617 60%),
      linear-gradient(120deg,#0a1f44,#020617);

    display:flex;
    align-items:center;
    justify-content:center;
    color:#e5f3ff;
}

 canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0, 0, 0, 0.799);
    z-index:-1;
}

/* Main Card */
.card{
    text-align:center;
    padding:50px 60px;
    background:rgba(255,255,255,0.03);
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 40px rgba(0,255,255,0.08);
    animation:fadeUp 1.2s ease;
}

/* Intro */
h1{
    font-size:2.5rem;
    font-weight:700;
}

.intro{
    margin:15px 0 30px;
    font-size:1.05rem;
    color:#b8dfff;
    line-height:1.6;
}

/* Connect Text */
.connect{
    margin-bottom:15px;
    font-size:1.1rem;
    color:#00f7ff;
    letter-spacing:1px;
}

/* Social Icons */   
.social{
    display:flex;
    justify-content:center;
    gap:22px;
}

.social a{
    font-size:1.8rem;
    color:#e5f3ff;
    transition:0.3s ease;
}

.social a:hover{
    color:#00f7ff;
    transform:translateY(-5px) scale(1.2);
    text-shadow:0 0 12px #00f7ff;
}

/* Animation */
@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

    <!-- Name -->
    <h1>Hello, I’m Shadman Shakib</h1>

    <!-- intro -->
    <p class="intro">
        I’m a tech enthusiast passionate about web, security and modern digital experiences.<br>
        Always learning and building new projects to explore the digital frontier.
    </p>

    <!-- Invite -->
    <div class="connect">Connect with me </div>

    <!-- Social Links -->
    <div class="social">
        <a href="https://www.facebook.com/shadman.shakib.1529"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com/_shadman__shakib_"><i class="fab fa-instagram"></i></a>
       <!-- <a href="#"><i class="fab fa-x-twitter"></i></a> -->
        <a href="#"><i class="fab fa-linkedin"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
    </div>

</div>

</body>
</html>
